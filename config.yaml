# 试点配置：可按需修改

paths:
  # 默认读取上级目录的名单；也可改成项目内路径
  name_list: ../name_list.xlsx
  database: data/wechat_archive.db
  sessions_dir: sessions

crawl:
  # 历史时间窗（含边界）
  start_date: "2018-01-01"
  # 系统当前为 2026；样例文也可能是当年发文
  end_date: "2026-12-31"
  # 请求间隔（秒），慢速优先
  sleep_min: 4
  sleep_max: 9
  # 历史列表每页条数（微信接口通常为 10）
  history_page_size: 10
  # 账号与正文都按有界批次读取，避免十万/百万行一次性进入内存
  account_batch_size: 200
  content_batch_size: 500
  # 正文失败最多重试次数
  content_max_retries: 3
  # 微信返回访问频繁时使用长冷却，不快速轮换所有会话
  history_rate_limit_retries: 2
  history_rate_limit_cooldown: 300
  content_rate_limit_cooldown: 900
  # User-Agent：模拟微信内置浏览器
  user_agent: >-
    Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X)
    AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148
    MicroMessenger/8.0.40(0x18002831) NetType/WIFI Language/zh_CN

http:
  timeout: 30
  max_retries: 3
  backoff_factor: 1.0
  pool_connections: 4
  pool_maxsize: 8
  # 禁用系统代理，避免本机抓包软件干扰
  trust_env: false
  # 可选：http://user:pass@host:port 或 socks5://host:port
  proxy:

jobs:
  # 历史列表接口对并发敏感，默认只运行一个持久任务
  workers: 1
  heartbeat_interval: 10
  progress_interval: 5
  event_retention_days: 30

database:
  # SQLite 单机大库的保守参数；cache_size_kib 使用负数表示 KiB
  synchronous: NORMAL
  cache_size_kib: -65536
  mmap_size: 268435456
  wal_autocheckpoint: 1000
