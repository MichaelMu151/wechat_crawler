# 默认约定：两个仓库同级放置
#
#   wechat-work/
#     name_list.xlsx
#     wechat_crawler/          ← 本项目
#     wechat-download-api/     ← 另一个 GitHub 仓库
#
# 可用 CLI --profile safe|balanced|fast 覆盖 crawl 节奏（见 wechat_archive/config.py）

paths:
  # 名单默认放在上一级工作目录（与两个仓库同级）
  name_list: ../name_list.xlsx
  database: data/wechat_archive.db
  sessions_dir: sessions
  platform_credentials: sessions/platform_credentials.yaml

# 历史列表后端：
# - platform: 直接用公众号后台凭证调 searchbiz / appmsgpublish（推荐）
# - download_api: 调用同级 wechat-download-api 的 HTTP 接口
platform:
  backend: platform
  download_api_base_url: http://127.0.0.1:5000
  # import-platform-from-download-api 未传 --env 时使用此路径
  download_api_env: ../wechat-download-api/.env

crawl:
  # 历史时间窗（含边界）
  start_date: "2018-01-01"
  end_date: "2026-12-31"
  # 历史列表请求间隔（秒）；平台接口敏感，默认偏安全
  sleep_min: 10
  sleep_max: 20
  # 历史列表每页条数（动态升降的中枢；遇限流会降到 min）
  history_page_size: 15
  history_page_size_min: 5
  history_page_size_max: 40
  # 账号与正文都按有界批次读取
  account_batch_size: 200
  content_batch_size: 500
  # 正文抓取：独立间隔 + 有限并发
  content_sleep_min: 1.5
  content_sleep_max: 3.5
  content_concurrency: 2
  content_max_retries: 3
  content_circuit_breaker_threshold: 5
  # 微信返回访问频繁时：单账号冷却 + 连续失败熔断
  history_rate_limit_retries: 2
  history_rate_limit_cooldown: 900
  history_circuit_breaker_threshold: 3
  history_global_cooldown: 3600
  history_reclaim_running_on_start: true
  history_stale_running_minutes: 30
  content_rate_limit_cooldown: 600
  # User-Agent：模拟微信内置浏览器
  user_agent: >-
    Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X)
    AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148
    MicroMessenger/8.0.40(0x18002831) NetType/WIFI Language/zh_CN

http:
  timeout: 30
  max_retries: 3
  backoff_factor: 1.0
  pool_connections: 8
  pool_maxsize: 16
  trust_env: false
  proxy:

jobs:
  workers: 1
  heartbeat_interval: 10
  progress_interval: 5
  event_retention_days: 30

database:
  synchronous: NORMAL
  cache_size_kib: -65536
  mmap_size: 268435456
  wal_autocheckpoint: 1000
