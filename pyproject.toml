[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-archive"
version = "0.2.0"
description = "Resilient local archive for WeChat Official Account articles"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "click>=8.1",
  "fastapi>=0.115",
  "lxml>=5",
  "openpyxl>=3.1",
  "PyYAML>=6",
  "requests>=2.31",
  "rich>=13",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
]

[project.scripts]
wechat-archive = "wechat_archive.cli:cli"

[tool.setuptools.packages.find]
include = ["wechat_archive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
